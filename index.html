<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM 데일리 보드</title>
  <style>
    :root {
      --bg: #f1f5f9; --card: #fff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --subtle: #f8fafc;
      --primary: #0f766e; --primary-hover: #115e59; --error: #b91c1c;
      --ok-bg: #dcfce7; --ok-text: #166534; --off-bg: #e2e8f0; --off-text: #334155;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--text); line-height: 1.5; }
    .board { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
    @media (min-width: 900px) { .board { grid-template-columns: 1fr 1fr; } }
    .wide { grid-column: 1 / -1; }
    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid var(--border); }
    .card h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-size: 20px; }
    .card h2 svg { width: 22px; height: 22px; flex: none; stroke: var(--primary); }
    .muted { color: var(--muted); font-size: 14px; }
    .error { color: var(--error); }
    .big { font-size: 28px; font-weight: 700; margin: 4px 0; font-variant-numeric: tabular-nums; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
    label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
    input, select, button { font: inherit; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; color: var(--text); width: 100%; }
    button { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; cursor: pointer; transition: background-color .15s; }
    button:hover { background: var(--primary-hover); }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .result { margin-top: 16px; min-height: 24px; }
    .result p { margin: 4px 0; }
    ul { list-style: none; padding: 0; margin: 8px 0; }
    .result li { padding: 6px 0; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .source { margin: 16px 0 0; }
    .source a, .api-box a { color: var(--primary); }
    .cities { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .city { padding: 16px; border-radius: 12px; background: var(--subtle); border: 1px solid var(--border); }
    .city .big { font-size: 26px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--off-bg); color: var(--off-text); }
    .badge.working { background: var(--ok-bg); color: var(--ok-text); }
    .city-weather { margin-top: 8px; }
    .api-box { padding: 16px; border: 1px dashed #94a3b8; border-radius: 12px; background: var(--card); font-size: 13px; }
    .api-box li { margin-top: 12px; font-weight: 600; }
    .api-box li > div { font-weight: 400; }
    .api-box code { display: block; word-break: break-all; margin: 4px 0 2px; color: var(--off-text); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="board">
  <header class="wide">
    <h1>PM 데일리 보드</h1>
    <p>PO/PM이 아침마다 여는 한 화면: 스프린트 일정, 글로벌 미팅 시간, 해외 툴 비용</p>
  </header>

  <section class="card wide">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>글로벌 미팅 보드</h2>
    <div class="cities" id="cities"></div>
    <p class="muted">업무 중 = 현지 평일 09–18시</p>
    <p class="muted source"><a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a></p>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>스프린트 종료일 계산</h2>
    <form id="sprint-form">
      <label>시작일 <input type="date" id="sprint-start" required></label>
      <label>영업일 수 <input type="number" id="sprint-days" min="1" max="100" value="10" required></label>
      <label>국가 <select id="sprint-country"></select></label>
      <button>계산</button>
    </form>
    <div id="sprint-result" class="result" aria-live="polite"></div>
    <p class="muted source"><a href="https://date.nager.at" target="_blank" rel="noopener">Holiday data by Nager.Date</a></p>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>해외 SaaS 비용 환산</h2>
    <form id="cost-form">
      <label>월 단가 (USD) <input type="number" id="cost-price" min="0" step="0.01" value="15" inputmode="decimal" required></label>
      <label>좌석 수 <input type="number" id="cost-seats" min="1" step="1" value="10" inputmode="numeric" required></label>
    </form>
    <div id="cost-result" class="result muted" aria-live="polite">환율 불러오는 중…</div>
    <p class="muted source"><a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter (ECB 기준환율)</a></p>
  </section>

  <!-- 기능 카드는 Issue마다 여기에 추가 -->

  <div class="api-box wide">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <ul>
      <li>공휴일 (Nager.Date)
        <div id="api-holidays"></div>
      </li>
      <li>날씨 (Open-Meteo)
        <div id="api-weather"></div>
      </li>
      <li>환율 (Frankfurter)
        <div id="api-rate"></div>
      </li>
    </ul>
  </div>
  </main>

  <script>
    const API = {
      holidays: (year, country) => `https://date.nager.at/api/v3/PublicHolidays/${year}/${country}`, // 🔌 Nager.Date 나라별 공휴일
      weather: (lat, lon) => `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`, // 🔌 Open-Meteo 현재 날씨
      usdKrw: 'https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW', // 🔌 Frankfurter 달러→원 기준환율
    };

    // 영국·중국 등은 Nager.Date 데이터가 지역별로 나뉘거나 연휴가 빠져 있어서 제외
    const COUNTRIES = { KR: '한국', US: '미국', JP: '일본', SG: '싱가포르', DE: '독일' };

    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const pad = n => String(n).padStart(2, '0');
    const toIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const fromIso = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
    const withWeekday = iso => `${iso}(${WEEKDAYS[fromIso(iso).getDay()]})`;

    // 시작일이 영업일이면 1일째로 센다. 주말·공휴일은 건너뛴다.
    function addBusinessDays(startIso, days, holidayDates) {
      const d = fromIso(startIso);
      for (let count = 0; ; d.setDate(d.getDate() + 1)) {
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        if (!isWeekend && !holidayDates.has(toIso(d)) && ++count === days) return toIso(d);
      }
    }
    console.assert(addBusinessDays('2026-09-21', 5, new Set(['2026-09-24', '2026-09-25', '2026-09-26'])) === '2026-09-29', '영업일 계산 자체 점검 실패');

    const sprintResult = document.getElementById('sprint-result');
    let sprintRun = 0;

    function addLine(parent, tag, text, className) {
      const el = document.createElement(tag);
      el.textContent = text;
      if (className) el.className = className;
      parent.append(el);
    }

    function showApiUrls(boxId, urls) {
      const box = document.getElementById(boxId);
      box.replaceChildren();
      urls.forEach(url => {
        const code = document.createElement('code');
        code.textContent = url;
        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = '새 탭에서 원본 JSON 보기';
        box.append(code, link);
      });
    }

    const fetchJson = url => fetch(url) // 🔌 API 호출
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });

    function calcSprint() {
      const start = document.getElementById('sprint-start').value;
      const days = Number(document.getElementById('sprint-days').value);
      const country = document.getElementById('sprint-country').value;
      const year = Number(start.slice(0, 4));
      // 영업일은 최대 100일이라 종료일은 늦어도 다음 해 안에 있음 → 두 해를 함께 불러옴
      const urls = [year, year + 1].map(y => API.holidays(y, country));
      showApiUrls('api-holidays', urls);

      const run = ++sprintRun;
      sprintResult.className = 'result muted';
      sprintResult.textContent = '공휴일 불러오는 중…';

      Promise.all(urls.map(fetchJson))
        .then(lists => {
          if (run !== sprintRun) return; // 응답 전에 다시 계산했으면 무시
          // shortcut: 전국 공휴일만 셈(미국 주별 공휴일 등 제외), 지역 공휴일이 필요하면 counties로 지역 선택 추가
          const holidays = lists.flat().filter(h => h.global && h.types.includes('Public'));
          const end = addBusinessDays(start, days, new Set(holidays.map(h => h.date)));
          const inRange = holidays.filter(h => h.date >= start && h.date <= end);
          const holidayDays = new Set(inRange.map(h => h.date)).size;

          sprintResult.className = 'result';
          sprintResult.replaceChildren();
          addLine(sprintResult, 'p', `종료일 ${withWeekday(end)}`, 'big');
          addLine(sprintResult, 'p', holidayDays ? `사이에 낀 공휴일 ${holidayDays}일` : '사이에 낀 공휴일 없음');
          const list = document.createElement('ul');
          inRange.forEach(h => addLine(list, 'li', `${withWeekday(h.date)} ${country === 'KR' ? h.localName : h.name}`));
          sprintResult.append(list);
          addLine(sprintResult, 'p', `${COUNTRIES[country]} 전국 공휴일 기준 (${year}–${year + 1}년)`, 'muted');
        })
        .catch(err => {
          if (run !== sprintRun) return;
          sprintResult.className = 'result error';
          sprintResult.textContent = `⚠️ 공휴일을 불러오지 못했어요 (${err.message}). 잠시 후 다시 계산해 주세요.`;
        });
    }

    const countrySelect = document.getElementById('sprint-country');
    countrySelect.innerHTML = Object.entries(COUNTRIES).map(([code, name]) => `<option value="${code}">${name}</option>`).join('');
    const sprintForm = document.getElementById('sprint-form');
    countrySelect.addEventListener('change', () => sprintForm.requestSubmit()); // 입력 검사를 거쳐서 계산

    document.getElementById('sprint-start').value = toIso(new Date());
    sprintForm.addEventListener('submit', e => {
      e.preventDefault();
      calcSprint();
    });
    calcSprint();

    // ── 글로벌 미팅 보드 ──
    const CITIES = [
      { name: '서울', tz: 'Asia/Seoul', lat: 37.5665, lon: 126.978 },
      { name: '샌프란시스코', tz: 'America/Los_Angeles', lat: 37.7749, lon: -122.4194 },
      { name: '런던', tz: 'Europe/London', lat: 51.5072, lon: -0.1276 },
      { name: '싱가포르', tz: 'Asia/Singapore', lat: 1.3521, lon: 103.8198 },
    ];
    const WORK_START_HOUR = 9;
    const WORK_END_HOUR = 18;
    const CLOCK_REFRESH_MS = 30 * 1000;
    const EN_WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    // WMO 날씨 코드 → [설명, 이모지]
    const WEATHER = {
      0: ['맑음', '☀️'],
      1: ['대체로 맑음', '🌤️'], 2: ['구름 조금', '⛅'], 3: ['흐림', '☁️'],
      45: ['안개', '🌫️'], 48: ['서리 안개', '🌫️'],
      51: ['약한 이슬비', '🌦️'], 53: ['이슬비', '🌦️'], 55: ['강한 이슬비', '🌦️'],
      56: ['어는 이슬비', '🌧️'], 57: ['강한 어는 이슬비', '🌧️'],
      61: ['약한 비', '🌧️'], 63: ['비', '🌧️'], 65: ['강한 비', '🌧️'],
      66: ['어는 비', '🌧️'], 67: ['강한 어는 비', '🌧️'],
      71: ['약한 눈', '🌨️'], 73: ['눈', '🌨️'], 75: ['강한 눈', '❄️'], 77: ['싸락눈', '🌨️'],
      80: ['약한 소나기', '🌦️'], 81: ['소나기', '🌧️'], 82: ['강한 소나기', '⛈️'],
      85: ['약한 눈 소나기', '🌨️'], 86: ['강한 눈 소나기', '❄️'],
      95: ['뇌우', '⛈️'], 96: ['우박 동반 뇌우', '⛈️'], 99: ['강한 우박 동반 뇌우', '⛈️'],
    };

    // 현지 시각은 API가 아니라 브라우저 시간대로 계산 (날씨 API가 실패해도 보이게)
    function localNow(tz) {
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: 'numeric', minute: '2-digit', hourCycle: 'h23' })
          .formatToParts(new Date())
          .map(p => [p.type, p.value])
      );
      return { hour: Number(parts.hour), minute: parts.minute, weekday: EN_WEEKDAYS.indexOf(parts.weekday) };
    }

    document.getElementById('cities').innerHTML = CITIES.map((c, i) => `
      <div class="city">
        <strong>${c.name}</strong>
        <div class="big" id="city-time-${i}"></div>
        <span class="badge" id="city-status-${i}"></span>
        <div id="city-weather-${i}" class="city-weather muted" aria-live="polite">날씨 불러오는 중…</div>
      </div>`).join('');

    function renderClocks() {
      CITIES.forEach((c, i) => {
        const { hour, minute, weekday } = localNow(c.tz);
        const isWeekend = weekday === 0 || weekday === 6;
        const isWorking = !isWeekend && hour >= WORK_START_HOUR && hour < WORK_END_HOUR;
        document.getElementById(`city-time-${i}`).textContent = `${WEEKDAYS[weekday]} ${pad(hour)}:${minute}`;
        const status = document.getElementById(`city-status-${i}`);
        status.textContent = isWorking ? '업무 중' : isWeekend ? '주말' : '퇴근';
        status.classList.toggle('working', isWorking);
      });
    }

    function loadWeather(url, i) {
      const el = document.getElementById(`city-weather-${i}`);
      fetchJson(url)
        .then(data => {
          const { temperature_2m, weather_code, time } = data.current;
          const [desc, emoji] = WEATHER[weather_code] ?? ['알 수 없음', '❓'];
          el.className = 'city-weather';
          el.replaceChildren();
          addLine(el, 'div', `${emoji} ${temperature_2m}°C ${desc}`);
          addLine(el, 'div', `기준 ${time.slice(11)} (현지)`, 'muted');
        })
        .catch(err => {
          el.className = 'city-weather error';
          el.textContent = `⚠️ 날씨를 불러오지 못했어요 (${err.message})`;
        });
    }

    renderClocks();
    setInterval(renderClocks, CLOCK_REFRESH_MS);
    const weatherUrls = CITIES.map(c => API.weather(c.lat, c.lon));
    showApiUrls('api-weather', weatherUrls);
    weatherUrls.forEach(loadWeather); // 도시마다 따로 불러서 한 곳이 실패해도 나머지는 보이게

    // ── 해외 SaaS 비용 환산 ──
    const costForm = document.getElementById('cost-form');
    const costResult = document.getElementById('cost-result');
    const won = n => Math.round(n).toLocaleString('ko-KR');
    const usd = n => n.toLocaleString('en-US', { maximumFractionDigits: 2 });
    let usdRate = null; // { rate, date }

    function renderCost() {
      if (!usdRate) return; // 환율을 받기 전(로딩·실패)에는 그 화면을 그대로 둠
      costResult.className = 'result';
      costResult.replaceChildren();
      if (!costForm.checkValidity()) {
        addLine(costResult, 'p', '월 단가와 좌석 수를 확인해 주세요', 'error');
        return;
      }
      const price = Number(document.getElementById('cost-price').value);
      const seats = Number(document.getElementById('cost-seats').value);
      const totalUsd = price * seats;
      addLine(costResult, 'p', `월 약 ${won(totalUsd * usdRate.rate)}원`, 'big');
      addLine(costResult, 'p', `$${usd(price)} × ${seats}석 = $${usd(totalUsd)}`);
      addLine(costResult, 'p', `1 USD = ${usdRate.rate.toLocaleString('ko-KR')}원 (${usdRate.date} 기준)`, 'muted');
    }

    showApiUrls('api-rate', [API.usdKrw]);
    fetchJson(API.usdKrw)
      .then(data => {
        if (typeof data.rates?.KRW !== 'number') throw new Error('원화 환율이 응답에 없음');
        usdRate = { rate: data.rates.KRW, date: data.date };
        renderCost();
      })
      .catch(err => {
        costResult.className = 'result error';
        costResult.textContent = `⚠️ 환율을 불러오지 못했어요 (${err.message}). 잠시 후 새로고침해 주세요.`;
      });
    costForm.addEventListener('input', renderCost);
    costForm.addEventListener('submit', e => e.preventDefault());
  </script>
</body>
</html>
