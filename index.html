<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM 데일리 보드</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; align-content: center; gap: 16px; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; background: #eef4fb; color: #222; }
    .card { max-width: 480px; background: #fff; padding: 32px 48px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); text-align: center; }
    .muted { color: #777; font-size: 14px; }
    .api-box { width: 100%; max-width: 480px; box-sizing: border-box; padding: 12px 16px; border: 1px dashed #99a; border-radius: 12px; background: #fff; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PM 데일리 보드</h1>
    <p>PO/PM이 아침마다 여는 한 화면: 스프린트 일정, 글로벌 미팅 시간, 해외 툴 비용</p>
  </div>

  <!-- 기능 카드는 Issue마다 여기에 추가 -->

  <div class="api-box">
    <strong>🔌 이 화면이 쓰는 API</strong>
    <p class="muted">아직 부르는 API가 없어요. 기능을 만들면 실제로 부른 주소와 "새 탭에서 원본 JSON 보기" 링크가 여기에 보여요.</p>
  </div>
</body>
</html>
